<html lang="en">

<title>Entrance Practice Test</title>
<script>
window.MathJax = { tex: { inlineMath: [['\\(','\\)'], ['$', '$']], displayMath: [['\\[','\\]']] }, svg: { fontCache: 'global' } };

<style>
:root { --blue:#153f8f; --gold:#f2c300; --green:#049442; --bg:#f4f6fb; --card:#ffffff; --text:#111827; --muted:#667085; --line:#d8deea; --danger:#b42318; --ok:#027a48; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); font-size:18px; }
header { background:#07111f; color:white; padding:18px 20px; display:flex; gap:16px; align-items:center; box-shadow:0 2px 10px rgba(0,0,0,.2); }
.logo { width:74px; height:74px; object-fit:contain; background:#000; border-radius:50%; padding:3px; }
header h1 { margin:0; font-size:30px; font-weight:700; letter-spacing:.2px; }
header p { margin:6px 0 0; color:#d9e2f2; font-size:17px; }
.wrap { max-width:1180px; margin:22px auto; padding:0 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 6px 18px rgba(16,24,40,.06); padding:18px; margin-bottom:16px; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(160px,1fr)); gap:12px; }
label { display:block; font-size:16px; color:var(--muted); margin-bottom:7px; }
select,input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:10px; font-size:18px; background:white; color:var(--text); }
.subjects { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
.check { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:#fafbff; }
.check input { width:auto; }
button { border:0; border-radius:10px; padding:13px 18px; font-weight:700; cursor:pointer; background:var(--blue); color:white; font-size:18px; }
button.secondary { background:#eef2ff; color:#1d2939; border:1px solid var(--line); }
button.warn { background:var(--danger); }
button:disabled { opacity:.55; cursor:not-allowed; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.status { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; color:var(--muted); }
.pill { background:#eef2ff; color:#1d2939; padding:8px 12px; border-radius:999px; font-size:16px; }
.qtext { font-size:28px; line-height:1.6; margin:16px 0 18px; }
.options { display:grid; gap:10px; }
.option { text-align:left; width:100%; background:white; color:var(--text); border:1px solid var(--line); padding:17px; border-radius:12px; font-size:22px; font-weight:500; }
.option:hover { border-color:var(--blue); }
.option.selected { border:2px solid var(--blue); background:#eef4ff; }
.option.correct { border:2px solid var(--ok); background:#ecfdf3; }
.option.wrong { border:2px solid var(--danger); background:#fef3f2; }
.navgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:8px; margin-top:14px; }
.navbtn { padding:9px 0; border-radius:9px; background:#f8fafc; color:#1d2939; border:1px solid var(--line); }
.navbtn.answered { background:#d1e9ff; }
.navbtn.flagged { outline:2px solid var(--gold); }
.navbtn.current { background:var(--blue); color:white; }
.hidden { display:none !important; }
.result { font-size:18px; line-height:1.6; }
.review-item { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
.small { font-size:16px; color:var(--muted); }
.timer { font-weight:800; color:#101828; }
@media (max-width:800px) { .grid { grid-template-columns:1fr 1fr; } .qtext { font-size:24px; } header h1 { font-size:24px; } }
.topic-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0 10px; }
.topic-tools input { max-width:360px; }
.topic-box { max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fbfcff; padding:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:8px; }
.topic-item { display:flex; align-items:flex-start; gap:9px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:white; font-size:16px; color:#1f2937; line-height:1.35; }
.topic-item input { width:auto; margin-top:3px; }
.topic-subject { color:var(--muted); font-size:14px; display:block; margin-top:2px; }
.topic-count-note { font-size:16px; color:var(--muted); margin-top:8px; }

@media (max-width:520px) { .grid { grid-template-columns:1fr; } header { align-items:flex-start; } .logo { width:58px; height:58px; } }
</style>
</head>

let test=[], chosen=[], flagged=new Set(), selectedTopicSet=new Set(), index=0, endTime=0, timerHandle=null, finished=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function selectedSubjects(){return [...document.querySelectorAll('.subj:checked')].map(x=>x.value);}
function selectedTopicNos(){return [...selectedTopicSet];}
function renderTopicPicker(){
  const subs=selectedSubjects();
  const search=($('topicSearch')?.value||'').trim().toLowerCase();
  const box=$('topicBox'); if(!box) return;
  box.innerHTML='';
  let shown=0, checked=0;
  TOPICS.forEach(t=>{
    if(!subs.includes(t.subject)) return;
    const label=(String(t.no).padStart(3,'0')+' '+t.name+' '+t.subject).toLowerCase();
    if(search && !label.includes(search)) return;
    shown++;
    const item=document.createElement('label'); item.className='topic-item';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.className='topic-check'; cb.value=t.no; cb.checked=selectedTopicSet.has(t.no);
    cb.onchange=()=>{ if(cb.checked) selectedTopicSet.add(t.no); else selectedTopicSet.delete(t.no); updateTopicNote(); };
    const text=document.createElement('span');
    text.innerHTML='<b>'+String(t.no).padStart(3,'0')+'. '+t.name+'</b><span class="topic-subject">'+t.subject+'</span>';
    item.appendChild(cb); item.appendChild(text); box.appendChild(item);
  });
  checked=selectedTopicSet.size;
  $('topicNote').textContent=checked+' selected. '+shown+' visible topics.';
}
function updateTopicNote(){
  const checked=selectedTopicSet.size;
  const visible=document.querySelectorAll('.topic-check').length;
  if($('topicNote')) $('topicNote').textContent=checked+' selected. '+visible+' visible topics.';
}
function buildTest(count, topicCount, diff){
  const subs=selectedSubjects();
  const explicitlySelected=selectedTopicNos();
  let pool=BANK.filter(x=>subs.includes(x.subject) && (diff==='Any' || x.difficulty===diff));
  if(pool.length===0) pool=BANK.filter(x=>subs.includes(x.subject));
  let topics=[...new Set(pool.map(x=>x.topicNo))];
  let pickedTopics;
  if(explicitlySelected.length>0){
    const allowed=new Set(topics);
    pickedTopics=explicitlySelected.filter(t=>allowed.has(t));
  } else {
    pickedTopics=shuffle(topics.slice()).slice(0, Math.max(1, Math.min(topicCount, topics.length)));
  }
  if(pickedTopics.length===0) pickedTopics=shuffle(topics.slice()).slice(0, Math.max(1, Math.min(topicCount, topics.length)));
  let byTopic={}; pickedTopics.forEach(t=>byTopic[t]=[]);
  pool.forEach(q=>{ if(byTopic[q.topicNo]) byTopic[q.topicNo].push(q); });
  let result=[]; const topicList=shuffle(pickedTopics.slice()); let guard=0;
  while(result.length<count && guard<count*20){
    for(const t of topicList){
      if(result.length>=count) break;
      const arr=byTopic[t]; if(!arr || arr.length===0) continue;
      result.push(shuffle(arr.slice())[0]);
    }
    guard++;
    if(result.length>=pool.length) break;
  }
  const seen=new Set(); result=result.filter(q=>{if(seen.has(q.id)) return false; seen.add(q.id); return true;});
  if(result.length<count){
    const topicSet=new Set(pickedTopics);
    const extra=shuffle(pool.filter(q=>!seen.has(q.id) && topicSet.has(q.topicNo))).slice(0,count-result.length);
    result=result.concat(extra);
  }
  return shuffle(result).slice(0,count).map(q=>Object.assign({},q));
}
function start(useQuick=false){
  const qcount=useQuick?20:Math.max(5, Math.min(1650, parseInt($('qcount').value||120)));
  const tcount=useQuick?10:Math.max(1, Math.min(330, parseInt($('tcount').value||40)));
  const diff=$('difficulty').value;
  const mins=useQuick?20:Math.max(5, Math.min(240, parseInt($('minutes').value||120)));
  test=buildTest(qcount,tcount,diff); chosen=Array(test.length).fill(null); flagged=new Set(); index=0; finished=false;
  $('setup').classList.add('hidden'); $('done').classList.add('hidden'); $('exam').classList.remove('hidden');
  endTime=Date.now()+mins*60000; clearInterval(timerHandle); timerHandle=setInterval(tick,500); tick(); render();
}
function tick(){
  const left=Math.max(0, endTime-Date.now()); const m=Math.floor(left/60000); const s=Math.floor((left%60000)/1000);
  $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(left<=0) finish();
}
function render(){
  const q=test[index]; $('progress').textContent=`Question ${index+1} of ${test.length}`; $('answered').textContent=`Answered ${chosen.filter(x=>x!==null).length}`;
  $('question').innerHTML=q.q;
  const opt=$('options'); opt.innerHTML='';
  q.o.forEach((txt,i)=>{const b=document.createElement('button'); b.className='option'+(chosen[index]===i?' selected':''); b.innerHTML='<b>'+String.fromCharCode(65+i)+'.</b> '+txt; b.onclick=()=>{chosen[index]=i; render();}; opt.appendChild(b);});
  $('prevBtn').disabled=index===0; $('nextBtn').disabled=index===test.length-1; $('flagBtn').textContent=flagged.has(index)?'Unflag':'Flag';
  renderNav(); typeset();
}
function renderNav(){
 const nav=$('nav'); nav.innerHTML='';
 test.forEach((q,i)=>{const b=document.createElement('button'); b.className='navbtn'+(chosen[i]!==null?' answered':'')+(flagged.has(i)?' flagged':'')+(i===index?' current':''); b.textContent=i+1; b.onclick=()=>{index=i;render();}; nav.appendChild(b);});
}
function typeset(){ if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(); }
function finish(){
 if(finished) return; finished=true; clearInterval(timerHandle);
 let correct=0; test.forEach((q,i)=>{if(chosen[i]===q.a) correct++;});
 $('exam').classList.add('hidden'); $('done').classList.remove('hidden');
 const pct=test.length?((correct/test.length)*100).toFixed(2):'0.00';
 $('score').innerHTML=`<b>Score:</b> ${correct} / ${test.length}<br><b>Percentage:</b> ${pct}%<br><b>Attempted:</b> ${chosen.filter(x=>x!==null).length}`;
 $('review').classList.add('hidden'); $('review').innerHTML='';
}
function showReview(){
 const r=$('review'); r.innerHTML='';
 test.forEach((q,i)=>{
  const div=document.createElement('div'); div.className='review-item';
  let html=`<p><b>Q${i+1}.</b> ${q.q}</p>`;
  q.o.forEach((op,j)=>{
    let cls='option'; if(j===q.a) cls+=' correct'; if(chosen[i]===j && chosen[i]!==q.a) cls+=' wrong';
    html+=`<div class="${cls}"><b>${String.fromCharCode(65+j)}.</b> ${op}</div>`;
  });
  html+=`<p class="small"><b>Explanation:</b> ${q.e||'Review the marked correct option.'}</p>`;
  div.innerHTML=html; r.appendChild(div);
 });
 r.classList.remove('hidden'); typeset();
}
$('startBtn').onclick=()=>start(false); $('sampleBtn').onclick=()=>start(true); $('prevBtn').onclick=()=>{if(index>0){index--;render();}}; $('nextBtn').onclick=()=>{if(index<test.length-1){index++;render();}}; $('flagBtn').onclick=()=>{flagged.has(index)?flagged.delete(index):flagged.add(index);render();}; $('finishBtn').onclick=finish; $('newBtn').onclick=()=>location.reload(); $('reviewBtn').onclick=showReview;
document.querySelectorAll('.subj').forEach(x=>x.onchange=renderTopicPicker);
$('topicSearch').oninput=renderTopicPicker;
$('selectVisibleTopics').onclick=()=>{document.querySelectorAll('.topic-check').forEach(x=>{x.checked=true; selectedTopicSet.add(parseInt(x.value));}); updateTopicNote();};
$('clearTopics').onclick=()=>{selectedTopicSet.clear(); document.querySelectorAll('.topic-check').forEach(x=>x.checked=false); updateTopicNote();};
renderTopicPicker();
