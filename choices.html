<style>
:root{--bg:#07121f;--panel:#0c1d33;--ink:#f4f7fb;--muted:#9fb0c8;--line:#1d3c5f;--green:#18d174;--red:#ff4040;--amber:#ffbf3c;}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#143e5e 0,#07121f 45%,#050911 100%);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;}
.app{width:min(1180px,96vw);margin:0 auto;padding:18px 18px 28px;position:relative;}
.top-logo{display:block;width:30%;min-width:170px;max-width:340px;margin:0 auto 8px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 14px;}
.brand h1{font-size:clamp(24px,4vw,44px);margin:0;letter-spacing:.5px}.brand p{margin:5px 0 0;color:var(--muted);font-size:14px}.badge{border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:#dbeafe;background:rgba(255,255,255,.04)}
.main{display:grid;grid-template-columns:270px 1fr 190px;gap:16px;align-items:stretch}.panel,.question-card,.wolf-card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.28);}
.panel{padding:18px}.question-card{padding:24px 28px;min-height:470px;position:relative;overflow:hidden}.wolf-card{padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}.wolf-card img{width:100%;border-radius:18px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));}.wolf-card.flash img{animation:wolfFlash .55s steps(2,end) infinite}@keyframes wolfFlash{0%{opacity:.28;transform:scale(.96) rotate(-2deg)}50%{opacity:1;transform:scale(1.04) rotate(2deg)}100%{opacity:.35;transform:scale(.98)}}
.timer-wrap{display:grid;place-items:center;margin:4px auto 16px}.timer{width:210px;height:210px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--green) 360deg,rgba(255,255,255,.09) 0deg);transition:filter .2s}.timer.red{background:conic-gradient(var(--red) var(--deg),rgba(255,255,255,.1) 0deg);filter:drop-shadow(0 0 22px rgba(255,64,64,.35));}.timer:after{content:"";position:absolute;inset:15px;background:#07121f;border-radius:50%;border:1px solid rgba(255,255,255,.06)}.time-text{position:relative;z-index:1;text-align:center}.time-text .num{font-variant-numeric:tabular-nums;font-weight:850;font-size:44px}.time-text .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select{border:1px solid var(--line);border-radius:12px;background:#0d2746;color:var(--ink);padding:11px 12px;font-weight:700;cursor:pointer}button:hover{background:#12345c}.wide{grid-column:1/-1}select{width:100%;font-weight:600;background:#081a2f}.setting{margin-top:12px}.setting label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.progress{margin-top:14px;color:var(--muted);font-size:13px}.bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--amber));border-radius:99px}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:#cbd5e1}.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;border:1px solid rgba(255,255,255,.07)}.subject{color:#93c5fd}.difficulty{color:#fecaca;background:rgba(255,64,64,.14)}
.qtext{font-size:clamp(27px,3.4vw,46px);line-height:1.28;font-weight:750;margin-top:22px}.hint-box{margin-top:20px;border:1px solid rgba(255,191,60,.35);background:rgba(255,191,60,.10);border-radius:16px;padding:13px 15px;color:#fde68a;font-size:clamp(15px,1.6vw,19px);line-height:1.45}.hint-box b{color:#ffdf8a}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.opt{border:1px solid rgba(148,163,184,.28);border-radius:15px;padding:13px 14px;background:rgba(255,255,255,.045);font-size:clamp(17px,2vw,24px);line-height:1.25}.opt .letter{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#0f2d50;margin-right:9px;color:#bfdbfe;font-weight:900}.footer-note{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}.boom{animation:boom .45s ease-in-out 1}@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.04);filter:brightness(1.5)}100%{transform:scale(1)}}
@media(max-width:900px){.main{grid-template-columns:1fr}.wolf-card{max-width:220px;margin:0 auto}.options{grid-template-columns:1fr}.top-logo{width:45%}.question-card{min-height:360px}}

function tone(freq=880, dur=.08, type='sine', gain=.08){ if(!soundOn) return; const c=ctx(); const o=c.createOscillator(); const g=c.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(gain,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur); }
function beep(sec){ const mode=beepSelect.value; if(mode==='mute') return; if(mode==='classic') tone(sec<=3?1320:880, .07, 'sine', .08); if(mode==='digital') {tone(sec<=3?1600:1100,.045,'square',.045); setTimeout(()=>tone(sec<=3?1200:900,.035,'square',.035),45);} if(mode==='urgent') {tone(sec<=3?1900:1250,.045,'sawtooth',.045); setTimeout(()=>tone(sec<=3?1700:1050,.04,'sawtooth',.035),70);} }
function endSound(){ if(!soundOn) return; const mode=endSelect.value; if(mode==='uploaded'){ endAudio.currentTime=0; endAudio.play().catch(()=>{}); } else if(mode==='boom'){ tone(120,.22,'sine',.18); setTimeout(()=>tone(70,.35,'sawtooth',.12),90); } else if(mode==='buzzer'){ tone(180,.12,'square',.12); setTimeout(()=>tone(160,.12,'square',.12),140); setTimeout(()=>tone(140,.18,'square',.12),280); } else if(mode==='trumpet'){ tone(523,.1,'sawtooth',.08); setTimeout(()=>tone(659,.1,'sawtooth',.08),110); setTimeout(()=>tone(784,.22,'sawtooth',.09),220); } }
function render(){ const q=QUESTIONS[idx]; qNum.textContent = String(idx+1).padStart(2,'0'); qTotal.textContent=QUESTIONS.length; subject.textContent=q.subject; difficulty.textContent=q.difficulty; qText.innerHTML=q.q; hintText.textContent=q.hint || "Use the shortest reliable formula before substituting numbers."; hintBox.style.display = hintsOn ? 'block' : 'none'; progressFill.style.width=((idx+1)/QUESTIONS.length*100)+'%'; wolf.classList.add('flash'); setTimeout(()=>wolf.classList.remove('flash'),1600); if(optionsBox){ optionsBox.innerHTML = (q.options||[]).map((op,i)=>`<div class="opt"><span class="letter">${String.fromCharCode(65+i)}</span>${op}</div>`).join(''); }
 if(window.MathJax){ MathJax.typesetPromise(); }
 resetTimer(false); }
function resetTimer(autoStart=true){ cancelAnimationFrame(rafId); remaining=duration; lastBeepAt=99; startStamp=null; updateTimer(duration); if(autoStart && running) startTimer(); }
function startTimer(){ if(running && startStamp) return; running=true; startStamp=performance.now() - (duration-remaining)*1000; tick(); }
function pauseTimer(){ running=false; cancelAnimationFrame(rafId); startStamp=null; }
function tick(){ if(!running) return; const elapsed=(performance.now()-startStamp)/1000; remaining=Math.max(0,duration-elapsed); updateTimer(remaining); const s=Math.ceil(remaining); if(remaining<=10 && s!==lastBeepAt && s>0){ lastBeepAt=s; beep(s); if(s<=3) setTimeout(()=>beep(s),220); if(s<=2) setTimeout(()=>beep(s),420); }
 if(remaining<=0){ running=false; endSound(); card.classList.add('boom'); setTimeout(()=>card.classList.remove('boom'),460); setTimeout(()=>nextQuestion(true),650); return; } rafId=requestAnimationFrame(tick); }
function updateTimer(t){ const deg=(t/duration)*360; timer.style.setProperty('--deg',deg+'deg'); timer.style.background = t<=10 ? `conic-gradient(var(--red) ${deg}deg, rgba(255,255,255,.1) 0deg)` : `conic-gradient(var(--green) ${deg}deg, rgba(255,255,255,.09) 0deg)`; timer.classList.toggle('red', t<=10); timeNum.textContent=t.toFixed(1); }
function nextQuestion(auto=false){ idx=(idx+1)%QUESTIONS.length; render(); if(auto || running){ running=true; startTimer(); } }
function prevQuestion(){ idx=(idx-1+QUESTIONS.length)%QUESTIONS.length; render(); if(running) startTimer(); }
document.getElementById('startBtn').onclick=()=>{ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); startTimer(); };
document.getElementById('pauseBtn').onclick=()=>pauseTimer();
document.getElementById('nextBtn').onclick=()=>nextQuestion(false);
document.getElementById('prevBtn').onclick=()=>prevQuestion();
document.getElementById('restartBtn').onclick=()=>{ idx=0; running=false; render(); };
hintToggle.onclick=()=>{ hintsOn=!hintsOn; hintToggle.textContent=hintsOn?'Hints: On':'Hints: Off'; hintBox.style.display = hintsOn ? 'block' : 'none'; };
soundToggle.onclick=()=>{ soundOn=!soundOn; soundToggle.textContent=soundOn?'Sound: On':'Sound: Off'; };
timerSelect.onchange=()=>{ duration=parseInt(timerSelect.value,10); resetTimer(false); if(running) startTimer(); };
render();
</script></body></html>
