<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Latin+Modern+Mono&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#111111;
    --ink-soft:#3a3a3a;
    --ink-dim:#8a8a8a;
    --rule:#1a1a1a;
    --rule-light:#d9d9d6;
    --paper:#fafaf8;
    --serif:'EB Garamond', 'Georgia', 'Times New Roman', serif;
    --mono:'JetBrains Mono', 'Latin Modern Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--serif);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    overflow:hidden;
  }

  /* ============ SIDEBAR ============ */
  #sidebar{
    width:320px;
    min-width:240px;
    height:100vh;
    overflow-y:auto;
    border-right:1px solid var(--rule);
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  #sidebar-header{
    padding:36px 28px 20px;
    border-bottom:1px solid var(--rule);
  }
  #sidebar-header .kicker{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  #sidebar-header h1{
    font-size:28px;
    font-weight:600;
    letter-spacing:.01em;
    line-height:1.15;
  }
  #sidebar-header p{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:8px;
    font-style:italic;
    line-height:1.5;
  }
  #search{
    width:100%;
    padding:9px 0;
    margin-top:18px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--rule);
    color:var(--ink);
    font-size:14px;
    font-family:var(--serif);
    outline:none;
    border-radius:0;
  }
  #search::placeholder{ color:var(--ink-dim); font-style:italic; }
  #search:focus{ border-bottom:1px solid var(--ink); }

  .category{
    border-bottom:1px solid var(--rule-light);
  }
  .category-title{
    padding:16px 28px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    user-select:none;
  }
  .category-title .name{
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .category-title:hover .name{ color:var(--ink-soft); }
  .category-title .meta{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .category-title .count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
  }
  .category-title .arrow{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    transition:transform .15s ease;
    display:inline-block;
  }
  .category.open .arrow{ transform:rotate(90deg); }

  .topic-list{
    display:none;
    flex-direction:column;
    padding:0 0 14px 0;
  }
  .category.open .topic-list{ display:flex; }

  .topic-name{
    padding:10px 28px 4px 40px;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.16em;
    color:var(--ink-dim);
  }
  .file-item{
    padding:7px 28px 7px 40px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:10px;
    color:var(--ink-soft);
    line-height:1.4;
    position:relative;
  }
  .file-item::before{
    content:"—";
    color:var(--ink-dim);
    font-size:13px;
  }
  .file-item:hover{ color:var(--ink); }
  .file-item.active{
    color:var(--ink);
    font-weight:600;
  }
  .file-item.active::before{ content:"▸"; color:var(--ink); }
  .empty-msg{
    padding:7px 28px 9px 40px;
    font-size:12px;
    color:var(--ink-dim);
    font-style:italic;
  }

  /* ============ MAIN ============ */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  #topbar{
    padding:22px 40px;
    border-bottom:1px solid var(--rule);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
  }
  #topbar .titles{ min-width:0; }
  #current-title{
    font-size:22px;
    font-weight:600;
    line-height:1.3;
  }
  #breadcrumb{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:6px;
  }
  #download-link{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border:1px solid var(--ink);
    padding:8px 16px;
    white-space:nowrap;
    flex-shrink:0;
    transition:background .12s ease, color .12s ease;
  }
  #download-link:hover{ background:var(--ink); color:#fff; }

  #viewer-wrap{
    flex:1;
    background:#e9e9e6;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #viewer{
    width:100%;
    height:100%;
    border:none;
  }
  #placeholder{
    text-align:center;
    padding:40px;
    max-width:440px;
  }
  #placeholder .mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:18px;
  }
  #placeholder h2{
    font-size:30px;
    font-weight:600;
    margin-bottom:14px;
    line-height:1.25;
  }
  #placeholder p{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.7;
    font-style:italic;
  }

  /* Mobile */
  #menu-toggle{
    display:none;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:8px 14px;
    cursor:pointer;
    margin-bottom:10px;
  }

  @media (max-width: 768px){
    #sidebar{
      position:fixed;
      z-index:50;
      left:0; top:0; bottom:0;
      transform:translateX(-100%);
      transition:transform .2s ease;
      width:85%;
      box-shadow:2px 0 12px rgba(0,0,0,0.15);
    }
    #sidebar.open{ transform:translateX(0); }
    #menu-toggle{ display:inline-block; }
    #topbar{ padding:18px 20px; flex-direction:column; align-items:stretch; }
    #current-title{ font-size:19px; }
    #download-link{ align-self:flex-start; }
  }

  /* Scrollbars */
  #sidebar::-webkit-scrollbar{ width:6px; }
  #sidebar::-webkit-scrollbar-thumb{ background:var(--rule-light); }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <div class="kicker">Vol. I — Compiled edition</div>
    <h1>Study Library</h1>
    <p>NET, NTS &amp; entrance prep — cheat sheets, benchmarks &amp; formula books.</p>
    <input type="text" id="search" placeholder="Search the index…">
  </div>
  <div id="categories"></div>
</aside>

<main id="main">
  <div id="topbar">
    <div class="titles">
      <button id="menu-toggle">☰ Index</button>
      <div id="current-title">Welcome</div>
      <div id="breadcrumb"></div>
    </div>
    <a id="download-link" href="#" style="display:none;" download>Download</a>
  </div>
  <div id="viewer-wrap">
    <div id="placeholder">
      <div class="mark">§ 0 — Preface</div>
      <h2>Select a document</h2>
      <p>Choose a title from the index on the left to read it here, set in the page's native format.</p>
    </div>
    <iframe id="viewer" style="display:none;"></iframe>
  </div>
</main>

<script>
/* =========================================================
   LIBRARY DATA
   Edit this object to add/remove categories, topics, files.
   Each file's "file" path is relative to this HTML file.
   ========================================================= */
const LIBRARY = {
  "NUST Entry Test (NET)": {
    "Mathematics": [
      { name: "Maths Cheat Sheet", file: "NET___MATHS___Cheat_Sheet.pdf" },
      { name: "Math, Phy & Eng — 100/60/40 Strategy", file: "NET___Math_Phy_Eng___100_60_40.pdf" },
      { name: "FSC Math Formula & Trick Book", file: "fsc_math_formula_trick_book.pdf" }
    ],
    "Physics": [
      { name: "Physics Cheat Sheet", file: "NET___PHYSICS___Cheat_Sheet.pdf" }
    ],
    "Strategy": [
      { name: "MCQ Strategy & Benchmark", file: "NET_Benchmark_MCQ_Strategy_Branded_Project.pdf" }
    ]
  },
  "NTS Material": {
    "Analytical Reasoning": [
      { name: "NAT Analytical Prep — Benchmark", file: "NTS_NAT_Analytical_Prep___BASHIR_BENCHMARK.pdf" },
      { name: "NTS Practice Answers", file: "nts1_ans.pdf" }
    ],
    "Quantitative": [],
    "Verbal": []
  },
  "GSC Notes": {
    "General Science": [],
    "Computer Science": []
  },
  "Course Notes": {
    "CY-612 Data Analytics": [],
    "CY-223 Network Security": [],
    "CY-433 Penetration Testing": [],
    "CS-270 Professional Practices": []
  },
  "Other": {
    "Misc": [
      { name: "Test File", file: "test.pdf" }
    ]
  }
};

const categoriesEl = document.getElementById('categories');
const viewer = document.getElementById('viewer');
const placeholder = document.getElementById('placeholder');
const currentTitle = document.getElementById('current-title');
const breadcrumb = document.getElementById('breadcrumb');
const downloadLink = document.getElementById('download-link');

function buildSidebar(filter=""){
  categoriesEl.innerHTML = "";
  const q = filter.trim().toLowerCase();

  Object.entries(LIBRARY).forEach(([catName, topics]) => {
    let totalFiles = 0;
    let topicHtml = "";

    Object.entries(topics).forEach(([topicName, files]) => {
      const matched = files.filter(f => !q || f.name.toLowerCase().includes(q) || topicName.toLowerCase().includes(q) || catName.toLowerCase().includes(q));
      if (q && matched.length === 0) return;

      totalFiles += matched.length;

      topicHtml += `<div class="topic-group">
        <div class="topic-name">${topicName}</div>
        ${ matched.length
            ? matched.map(f => `<div class="file-item" data-file="${f.file}" data-cat="${catName}" data-topic="${topicName}" data-name="${f.name}"><span>${f.name}</span></div>`).join("")
            : `<div class="empty-msg">No entries yet</div>`
        }
      </div>`;
    });

    if (q && totalFiles === 0) return;

    const allCount = Object.values(topics).reduce((a,b)=>a+b.length,0);
    const div = document.createElement('div');
    div.className = "category" + (q ? " open" : "");
    div.innerHTML = `
      <div class="category-title">
        <span class="name">${catName}</span>
        <span class="meta"><span class="count">${String(allCount).padStart(2,'0')}</span><span class="arrow">▶</span></span>
      </div>
      <div class="topic-list">${topicHtml}</div>
    `;
    categoriesEl.appendChild(div);
  });

  categoriesEl.querySelectorAll('.category-title').forEach(title => {
    title.addEventListener('click', () => {
      title.parentElement.classList.toggle('open');
    });
  });

  categoriesEl.querySelectorAll('.file-item').forEach(item => {
    item.addEventListener('click', () => {
      categoriesEl.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      openFile(item.dataset.file, item.dataset.name, item.dataset.cat, item.dataset.topic);
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
    });
  });
}

function openFile(file, name, cat, topic){
  placeholder.style.display = "none";
  viewer.style.display = "block";
  viewer.src = file;
  currentTitle.textContent = name;
  breadcrumb.textContent = `${cat} / ${topic}`;
  downloadLink.href = file;
  downloadLink.setAttribute('download', name + ".pdf");
  downloadLink.style.display = "inline-block";
}

document.getElementById('search').addEventListener('input', e => buildSidebar(e.target.value));
document.getElementById('menu-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

buildSidebar();
</script>

</body>
</html>
